name: Claude Code
on:
  pull_request:
    types: [opened, synchronize]
  # @claude on a PR comment — re-run review or ask questions on demand.
  issue_comment:
    types: [created]
  # @claude on an issue (creation or assignment).
  issues:
    types: [opened, assigned]
  # @claude in a submitted PR review body.
  pull_request_review:
    types: [submitted]

concurrency:
  # Scope by event so a comment run never shares a group with a push-triggered
  # review (otherwise Claude posting its own summary comment would fire an
  # issue_comment run that cancels the still-running pull_request review).
  group: claude-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  # Only a new push supersedes an in-progress review; comment/issue runs never cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Permission ceiling for the called workflow: a called workflow's jobs can only
# downgrade, never elevate, the caller's token permissions, so the union of the
# central jobs' permission sets is granted here and narrowed per job centrally.
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  review:
    uses: AlphaFiTech/alphalend-workflows/.github/workflows/claude-review.yml@main
    with:
      job: review
    secrets: inherit
  assist:
    uses: AlphaFiTech/alphalend-workflows/.github/workflows/claude-review.yml@main
    with:
      job: assist
    secrets: inherit
